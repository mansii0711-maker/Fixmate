{% extends 'base.html' %}

{% block title %}Forgot Password | FixMate Account Recovery{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Reset Your Password</h2>
            <p>Enter your registered Gmail address to receive password reset OTP.</p>
        </div>

        <div class="auth-body">
            <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                <div class="form-group">
                    <label for="identifier" class="form-label">Registered Gmail Address *</label>
                    <input type="email" id="identifier" name="identifier" class="form-control" placeholder="Enter your registered Gmail address" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                    <i class="fa-solid fa-paper-plane"></i> Send Reset OTP Code
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--gray-600);">
                Remembered your password? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 700;">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Verify OTP & Reset Password | FixMate{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Enter Reset OTP</h2>
            <p>Verification code sent to registered Email: <strong>{{ email }}</strong></p>
        </div>

        <div class="auth-body">
            <form action="{{ url_for('auth.reset_password') }}" method="POST">
                <div class="form-group">
                    <label for="otp" class="form-label">6-Digit Verification OTP *</label>
                    <input type="text" id="otp" name="otp" class="form-control" placeholder="Enter 6-digit OTP" maxlength="6" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="new_password" class="form-label">New Password *</label>
                    <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm New Password *</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                    <i class="fa-solid fa-key"></i> Reset & Save New Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
